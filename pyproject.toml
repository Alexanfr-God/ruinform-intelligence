[project]
name = "ruinform-intelligence"
version = "0.2.5"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "openai>=2.0.0",
  "pydantic>=2.8.0",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
